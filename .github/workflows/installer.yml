name: Installer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        npm: ['11', '12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@${{ matrix.npm }} --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm run test:installer
